# klipper-hotspot macros. Installed by install.sh; overwritten on update, do not edit.
# Add to printer.cfg:   [include klipper-hotspot.cfg]
#
# Requires the gcode_shell_command Klipper extra (install it with KIAUH).
#
# Every macro runs one fixed command. Nothing typed by the user is ever passed to a shell.

[gcode_shell_command hotspot_cmd]
command: /usr/local/bin/klipper-hotspot
timeout: 90.0
verbose: True

[gcode_macro HOTSPOT_ON]
description: Switch the Wi-Fi radio to hotspot mode
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        RESPOND MSG="Hotspot: a print is in progress. It will not be interrupted, but this connection may drop."
    {% endif %}
    RESPOND MSG="Hotspot: enabling. If you are connected over Wi-Fi you will be disconnected. Connect to the hotspot (run HOTSPOT_CREDENTIALS on the printer screen)."
    RUN_SHELL_COMMAND CMD=hotspot_cmd PARAMS="on"

[gcode_macro HOTSPOT_OFF]
description: Leave hotspot mode and return to the normal Wi-Fi
gcode:
    RESPOND MSG="Hotspot: disabling. The machine will rejoin its usual Wi-Fi network, so you will be disconnected."
    RUN_SHELL_COMMAND CMD=hotspot_cmd PARAMS="off"

[gcode_macro HOTSPOT_STATUS]
description: Show hotspot state, SSID, IP and connected clients (never the password)
gcode:
    RUN_SHELL_COMMAND CMD=hotspot_cmd PARAMS="status"

[gcode_macro HOTSPOT_CREDENTIALS]
description: Show the hotspot SSID and password (stays in the console history)
gcode:
    RUN_SHELL_COMMAND CMD=hotspot_cmd PARAMS="credentials"
