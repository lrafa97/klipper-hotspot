# klipper-hotspot macros. Installed by install.sh; overwritten on update, do not edit.
# Add to printer.cfg:   [include klipper-hotspot.cfg]
#
# Requires two things in your Klipper config:
#   - the gcode_shell_command extra (install it with KIAUH)
#   - a [respond] section (needed for RESPOND and for the on-screen messages)
#
# Every macro runs one fixed command. Nothing typed by the user is ever passed to a shell.
# The --screen flag also shows the result as a dialog on the machine screen (KlipperScreen,
# and Mainsail), through a Klipper action prompt sent by Moonraker.

[gcode_shell_command hotspot_cmd]
command: /usr/local/bin/klipper-hotspot
timeout: 90.0
verbose: True

[gcode_macro HOTSPOT_ON]
description: Switch the Wi-Fi radio to hotspot mode
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        RESPOND MSG="Hotspot: a print is in progress. It will not be interrupted, but the Mainsail connection may drop."
    {% endif %}
    RESPOND MSG="Hotspot: switching, this takes up to a minute. A Wi-Fi connection to this machine will drop."
    RUN_SHELL_COMMAND CMD=hotspot_cmd PARAMS="on --screen"

[gcode_macro HOTSPOT_OFF]
description: Leave hotspot mode and return to the normal Wi-Fi
gcode:
    RESPOND MSG="Hotspot: switching off. The machine rejoins its usual Wi-Fi, so a hotspot connection will drop."
    RUN_SHELL_COMMAND CMD=hotspot_cmd PARAMS="off --screen"

[gcode_macro HOTSPOT_STATUS]
description: Show hotspot state, SSID, IP and connected clients (never the password)
gcode:
    RUN_SHELL_COMMAND CMD=hotspot_cmd PARAMS="status --screen"

[gcode_macro HOTSPOT_CREDENTIALS]
description: Show the hotspot SSID and password (also stays in the console history)
gcode:
    RUN_SHELL_COMMAND CMD=hotspot_cmd PARAMS="credentials --screen"
