# KlipperScreen menu entries for klipper-hotspot. They go inside the More menu.
# Paste into KlipperScreen.conf (usually in the printer_data config folder), above the
# "Do not edit below this line" marker if there is one, then restart KlipperScreen.
# Keep square brackets out of comments in this file: KlipperScreen reads them as broken section headers.
#
# Syntax follows the KlipperScreen configuration docs. The More menu already exists in
# KlipperScreen (it is defined in its main_menu.conf), so these entries just extend it.
# A sub-menu is made by extending the section name. The panel key is not used, because method,
# params and confirm do not work with it. The icon network is the one KlipperScreen uses itself.
#
# Every entry is hidden unless the matching macro is loaded. Without the include line for
# klipper-hotspot.cfg in printer.cfg you get no button, instead of a button that fails.

[menu __main more hotspot]
name: Hotspot
icon: network
enable: {{ 'HOTSPOT_ON' in printer.gcode_macros.list }}

[menu __main more hotspot on]
name: Hotspot on
icon: network
method: printer.gcode.script
params: {"script": "HOTSPOT_ON"}
confirm: 'Switch to hotspot? This machine will leave its Wi-Fi network.'
enable: {{ 'HOTSPOT_ON' in printer.gcode_macros.list }}

[menu __main more hotspot off]
name: Hotspot off
icon: network
method: printer.gcode.script
params: {"script": "HOTSPOT_OFF"}
enable: {{ 'HOTSPOT_OFF' in printer.gcode_macros.list }}

[menu __main more hotspot status]
name: Status
icon: network
method: printer.gcode.script
params: {"script": "HOTSPOT_STATUS"}
enable: {{ 'HOTSPOT_STATUS' in printer.gcode_macros.list }}

[menu __main more hotspot credentials]
name: Password
icon: network
method: printer.gcode.script
params: {"script": "HOTSPOT_CREDENTIALS"}
enable: {{ 'HOTSPOT_CREDENTIALS' in printer.gcode_macros.list }}
