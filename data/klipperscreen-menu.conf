# KlipperScreen menu entries for klipper-hotspot.
# Paste into KlipperScreen.conf (usually ~/printer_data/config/KlipperScreen.conf), then restart
# KlipperScreen (sudo systemctl restart KlipperScreen).
#
# Syntax follows the KlipperScreen configuration docs: a sub-menu is made by extending the section
# name; "panel" is not used because method, params and confirm do not work together with it.
# Not yet tried on a real screen. The icon name "network" is an assumption: icons are files in
# KlipperScreen's styles/<theme>/images/ folder, so if the button shows no icon, pick another name.
#
# Every entry is hidden unless the matching macro is loaded, so a missing [include
# klipper-hotspot.cfg] in printer.cfg shows no button instead of a button that fails.

[menu __main hotspot]
name: Hotspot
icon: network
enable: {{ 'HOTSPOT_ON' in printer.gcode_macros.list }}

[menu __main hotspot on]
name: Hotspot on
icon: network
method: printer.gcode.script
params: {"script": "HOTSPOT_ON"}
confirm: 'Switch to hotspot? This machine will leave its Wi-Fi network.'
enable: {{ 'HOTSPOT_ON' in printer.gcode_macros.list }}

[menu __main hotspot off]
name: Hotspot off
icon: network
method: printer.gcode.script
params: {"script": "HOTSPOT_OFF"}
enable: {{ 'HOTSPOT_OFF' in printer.gcode_macros.list }}

[menu __main hotspot status]
name: Status
icon: network
method: printer.gcode.script
params: {"script": "HOTSPOT_STATUS"}
enable: {{ 'HOTSPOT_STATUS' in printer.gcode_macros.list }}

[menu __main hotspot credentials]
name: Password
icon: network
method: printer.gcode.script
params: {"script": "HOTSPOT_CREDENTIALS"}
enable: {{ 'HOTSPOT_CREDENTIALS' in printer.gcode_macros.list }}
