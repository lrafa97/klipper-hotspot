# KlipperScreen menu entries for klipper-hotspot.
# Paste into KlipperScreen.conf (usually ~/printer_data/config/KlipperScreen.conf), then restart
# KlipperScreen. VERIFY against the KlipperScreen docs for your version: menu nesting, the
# "confirm" key and the icon name are written from memory and not tested on a real screen.

[menu __main hotspot]
name: Hotspot
icon: network
panel: menu

[menu __main hotspot on]
name: Hotspot on
icon: network
method: printer.gcode.script
params: {"script": "HOTSPOT_ON"}
confirm: Switch to hotspot? This machine will leave its Wi-Fi network.

[menu __main hotspot off]
name: Hotspot off
icon: network
method: printer.gcode.script
params: {"script": "HOTSPOT_OFF"}

[menu __main hotspot status]
name: Status
icon: network
method: printer.gcode.script
params: {"script": "HOTSPOT_STATUS"}

[menu __main hotspot credentials]
name: Password
icon: network
method: printer.gcode.script
params: {"script": "HOTSPOT_CREDENTIALS"}
